name: Release CCAP v0.2.0 Scientific

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: ccap-windows-x64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            asset_name: ccap-windows-x86.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: ccap-windows-arm64.exe

          # --- Linux (GNU) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ccap-linux-x64
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            asset_name: ccap-linux-x86
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: ccap-linux-arm64
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            asset_name: ccap-linux-arm32

          # --- macOS ---
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: ccap-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: ccap-macos-arm64

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build for Windows/macOS
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build for Linux (using Cross)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cross
          cross build --release --target ${{ matrix.target }}

      - name: Prepare Assets
        shell: bash
        run: |
          # 處理不同平台的執行檔名稱
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            BIN_NAME="target/${{ matrix.target }}/release/ccap-kernel.exe"
          else
            BIN_NAME="target/${{ matrix.target }}/release/ccap-kernel"
          fi
          cp $BIN_NAME ${{ matrix.asset_name }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
